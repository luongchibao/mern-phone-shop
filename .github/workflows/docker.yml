name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build API Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/phone-shop-api:latest ./server

      - name: Build WEB Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/phone-shop-web:latest ./client

      - name: Push API Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/phone-shop-api:latest

      - name: Push WEB Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/phone-shop-web:latest